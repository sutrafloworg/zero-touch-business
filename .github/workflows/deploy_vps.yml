name: Deploy Webhook Server to VPS

# Rebuilds and restarts the Docker container on the Oracle Cloud VPS
# whenever new code is pushed to feat/content-quality-eeat, or triggered manually.
#
# IMPORTANT: VPS tracks feat/content-quality-eeat (NOT main) so that the bind-mounted
# data directory (/opt/localrank/business3_local_seo/data/) is on the same branch
# that the weekly GitHub Actions scanner reads and commits subscribers.json and
# pending_reports.json to.  Without this, subscribers registered via the website
# are written to one branch and read by the scanner from another — they never meet.
#
# Required GitHub Secrets (add once in repo Settings → Secrets → Actions):
#   VPS_HOST    — public IP of the Oracle Cloud instance (e.g. 152.x.x.x)
#   VPS_USER    — SSH username (typically "ubuntu" or "opc")
#   VPS_SSH_KEY — contents of your Oracle Cloud SSH private key (.pem file)
#
# Setup: paste the .pem file contents as VPS_SSH_KEY secret, then this
# workflow auto-deploys every time business3_local_seo/ changes on feat branch.

on:
  push:
    branches: [feat/content-quality-eeat]
    paths:
      - 'business3_local_seo/**'
      - '.github/workflows/deploy_vps.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pull latest code + rebuild Docker on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="/opt/localrank"

            echo "=== [0/4] Opening port 8080 in firewall ==="
            # Oracle Cloud Ubuntu blocks ALL inbound ports by default via iptables.
            # Docker -p alone does NOT bypass this — the VPS iptables INPUT chain
            # has a catch-all REJECT at the end that drops external connections
            # before Docker's DOCKER chain can handle them.
            sudo iptables -C INPUT -p tcp --dport 8080 -j ACCEPT 2>/dev/null || \
              sudo iptables -I INPUT 6 -m state --state NEW -p tcp --dport 8080 -j ACCEPT
            # Persist rules so they survive reboots (install if not present)
            sudo apt-get install -y iptables-persistent < /dev/null 2>/dev/null || true
            sudo netfilter-persistent save 2>/dev/null || \
              sudo sh -c 'iptables-save > /etc/iptables/rules.v4' 2>/dev/null || true
            echo "Port 8080: iptables rule confirmed."

            echo "=== [0b/4] Ensuring required env vars are set in .env ==="
            ENV_FILE="$APP_DIR/business3_local_seo/deploy/.env"
            if [ -f "$ENV_FILE" ]; then
              sudo grep -q "^ADMIN_TOKEN=" "$ENV_FILE" 2>/dev/null || \
                echo "ADMIN_TOKEN=sf-webhook-admin-2026" | sudo tee -a "$ENV_FILE" > /dev/null
              echo "ADMIN_TOKEN confirmed in .env"

              # ALERT_EMAIL — destination for testimonial/watchdog notifications
              sudo grep -q "^ALERT_EMAIL=" "$ENV_FILE" 2>/dev/null || \
                echo "ALERT_EMAIL=sutrafloworg@gmail.com" | sudo tee -a "$ENV_FILE" > /dev/null
              echo "ALERT_EMAIL confirmed in .env"
            fi

            echo "=== [1/4] Pulling latest code from main ==="
            cd "$APP_DIR"
            # Repo is owned by root — run all git commands with sudo so they can
            # write to .git/FETCH_HEAD and other root-owned git metadata files.
            sudo git config --global --add safe.directory "$APP_DIR"
            sudo git fetch origin main
            sudo git checkout main 2>/dev/null || true
            sudo git reset --hard origin/main

            echo "=== [2/4] Rebuilding Docker image ==="
            # Use raw docker build/run (docker-compose v1 has a KeyError:'ContainerConfig'
            # bug with newer Docker daemon versions on Ubuntu 22.04)
            sudo docker build -t localrank-webhook "$APP_DIR/business3_local_seo/"

            echo "=== [3/4] Restarting container ==="
            sudo docker stop localrank-webhook 2>/dev/null || true
            sudo docker rm   localrank-webhook 2>/dev/null || true
            sudo docker run -d \
              --name localrank-webhook \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file "$APP_DIR/business3_local_seo/deploy/.env" \
              -v "$APP_DIR/business3_local_seo/data:/app/data" \
              -v "$APP_DIR/business3_local_seo/reports:/app/reports" \
              localrank-webhook

            echo "=== [4/4] Health check (local + external) ==="
            sleep 8

            # 1. Local check — confirms Docker container is running
            LOCAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8080/health 2>/dev/null || echo "000")
            echo "Local health check (127.0.0.1:8080): $LOCAL_CODE"

            # 2. External check — confirms iptables is NOT blocking external traffic
            # Get this instance's public IP and test from the outside
            PUBLIC_IP=$(curl -s --max-time 5 https://api.ipify.org 2>/dev/null || \
                        curl -s --max-time 5 https://ifconfig.me 2>/dev/null || echo "")
            if [ -n "$PUBLIC_IP" ]; then
              EXT_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
                http://$PUBLIC_IP:8080/health 2>/dev/null || echo "000")
              echo "External health check (http://$PUBLIC_IP:8080/health): $EXT_CODE"
              if [ "$EXT_CODE" != "200" ]; then
                echo "⚠️  External access blocked even though container is running!"
                echo "Checking iptables INPUT chain..."
                sudo iptables -L INPUT -n --line-numbers | grep -E "8080|ACCEPT|REJECT|DROP" | head -20
                echo "Trying to force-add rule again..."
                sudo iptables -I INPUT 1 -p tcp --dport 8080 -j ACCEPT
                sudo netfilter-persistent save 2>/dev/null || true
                sleep 3
                EXT_CODE2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 \
                  http://$PUBLIC_IP:8080/health 2>/dev/null || echo "000")
                echo "External re-check: $EXT_CODE2"
              fi
            else
              echo "Could not determine public IP — skipping external check"
              EXT_CODE="SKIP"
            fi

            # Container status
            RUNNING=$(sudo docker ps --filter name=localrank-webhook --format "{{.Status}}" 2>/dev/null || echo "not found")
            echo "Container status: $RUNNING"

            if [ "$LOCAL_CODE" = "200" ]; then
              echo "✅ Deployment successful (local: $LOCAL_CODE, external: $EXT_CODE)"
            else
              echo "❌ Health check failed — dumping container logs"
              sudo docker logs localrank-webhook --tail=40
              exit 1
            fi
