name: Resend Test Email
on:
  workflow_dispatch:
    inputs:
      to_email:
        description: "Recipient"
        required: true
        default: "sutrafloworg@gmail.com"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ github.event.inputs.to_email }}
        run: |
          pip install requests
          python - <<'EOF'
          import os, requests, datetime
          r = requests.post('https://api.resend.com/emails',
            headers={'Authorization': f"Bearer {os.environ['RESEND_API_KEY']}", 'Content-Type': 'application/json'},
            json={'from': 'Search Sentinel <sentinel@sutraflow.org>',
                  'to': [os.environ['TO_EMAIL']],
                  'subject': 'Resend integration test - ' + datetime.datetime.utcnow().isoformat() + 'Z',
                  'html': '<p>This is an automated test. If you see this email FROM <strong>sentinel@sutraflow.org</strong>, the Resend integration is fully live.</p><p>You can reply to this email and it will reach sutrafloworg@gmail.com via Cloudflare Email Routing.</p>',
                  'reply_to': 'sutrafloworg@gmail.com'})
          print('HTTP', r.status_code, r.text)
          r.raise_for_status()
          EOF
