name: Search Sentinel — Daily Quota Check

on:
  schedule:
    - cron: "0 12 * * *"   # Every day at noon UTC (7am ET)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "business3_local_seo/requirements.txt"

      - name: Install Python dependencies
        run: pip install -r business3_local_seo/requirements.txt

      - name: Run quota check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        working-directory: business3_local_seo
        run: python quota_warning.py
