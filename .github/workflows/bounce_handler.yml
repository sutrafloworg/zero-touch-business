name: Search Sentinel — Daily Bounce Handler

# Runs every day at 11am UTC (6am ET) — after Monday's outreach has had time
# to generate bounce notifications. Reads Gmail inbox via IMAP, suppresses
# any address that hard-bounced.

on:
  schedule:
    - cron: "0 11 * * *"   # Daily 11am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only — preview without modifying suppression list"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  scan-bounces:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "business3_local_seo/requirements.txt"

      - name: Install Python dependencies
        run: pip install -r business3_local_seo/requirements.txt

      - name: Run bounce handler
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        working-directory: business3_local_seo
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            python bounce_handler.py --dry-run
          else
            python bounce_handler.py
          fi

      - name: Run reply handler (unsubscribe replies + warm-lead alerts)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        working-directory: business3_local_seo
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            python reply_handler.py --dry-run
          else
            python reply_handler.py
          fi

      - name: Commit suppression updates
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "Search Sentinel Bot"
          git config user.email "bot@github-actions"
          git add business3_local_seo/data/suppression.json business3_local_seo/data/replies_seen.json || true
          git diff --staged --quiet || git commit -m "bounce+reply handler: suppression/replies update $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main || true
          git push || true
